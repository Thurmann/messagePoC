spring:
  application:
    name: validation-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: validation-service-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: no.thurmann.messagepoc.contracts
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

moderation:
  reject-threshold: ${MODERATION_REJECT_THRESHOLD:0.7}
  dlt-threshold: ${MODERATION_DLT_THRESHOLD:0.95}

logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
        environment: ${DEPLOYMENT_ENVIRONMENT:local}
        instanceId: ${INSTANCE_ID:${HOSTNAME:local}}
