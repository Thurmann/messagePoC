spring:
  application:
    name: message-api
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:message_poc}}
    username: ${DB_USER:message_poc}
    password: ${DB_PASSWORD:message_poc}
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8080}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
        environment: ${DEPLOYMENT_ENVIRONMENT:local}
        instanceId: ${INSTANCE_ID:${HOSTNAME:local}}
