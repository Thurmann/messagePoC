spring:
  application:
    name: message-persistence
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:message_poc}}
    username: ${DB_USER:message_poc}
    password: ${DB_PASSWORD:message_poc}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: message-persistence-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: no.thurmann.messagepoc.contracts
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8083}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

admin:
  emails: ${ADMIN_EMAILS:christian.thurmann@gmail.com}

app:
  message-api-base-url: ${MESSAGE_API_BASE_URL:}

moderation:
  warning-threshold: ${MODERATION_WARNING_THRESHOLD:3}
  ban-threshold: ${MODERATION_BAN_THRESHOLD:6}
  ban-ladder: ${MODERATION_BAN_LADDER:1m,5m,30m,2h,12h,24h}
  escalation-window: ${MODERATION_ESCALATION_WINDOW:1d}
  technical-dlt-counts-as-strike: ${MODERATION_TECHNICAL_DLT_COUNTS_AS_STRIKE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
        environment: ${DEPLOYMENT_ENVIRONMENT:local}
        instanceId: ${INSTANCE_ID:${HOSTNAME:local}}
