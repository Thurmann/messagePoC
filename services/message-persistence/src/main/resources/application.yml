spring:
  application:
    name: message-persistence
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:message_poc}}
    username: ${DB_USER:message_poc}
    password: ${DB_PASSWORD:message_poc}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: message-persistence-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: no.thurmann.messagepoc.contracts
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8083}

logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
        environment: ${DEPLOYMENT_ENVIRONMENT:local}
        instanceId: ${INSTANCE_ID:${HOSTNAME:local}}
