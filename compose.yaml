name: message-poc

x-application-environment: &application-environment
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
  DEPLOYMENT_ENVIRONMENT: local
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
  SPRING_MAIN_BANNER_MODE: "off"

x-kafka-broker-environment: &kafka-broker-environment
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  kafka-1:
    image: apache/kafka:4.3.1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-broker-environment
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://:9093,HOST://:9092,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka-1:29092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-2:
    image: apache/kafka:4.3.1
    hostname: kafka-2
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-broker-environment
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://:9093,HOST://:9094,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9094,DOCKER://kafka-2:29092
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-3:
    image: apache/kafka:4.3.1
    hostname: kafka-3
    ports:
      - "9096:9096"
    environment:
      <<: *kafka-broker-environment
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://:9093,HOST://:9096,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9096,DOCKER://kafka-3:29092
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9096 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092,kafka-2:29092,kafka-3:29092 --create --if-not-exists --topic poc.messages.submitted.v1 --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092,kafka-2:29092,kafka-3:29092 --create --if-not-exists --topic poc.messages.results.v1 --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092,kafka-2:29092,kafka-3:29092 --create --if-not-exists --topic poc.messages.submitted.v1-dlt --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:29092,kafka-2:29092,kafka-3:29092 --create --if-not-exists --topic poc.messages.results.v1-dlt --partitions 3 --replication-factor 3 --config min.insync.replicas=2

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: message_poc
      POSTGRES_USER: message_poc
      POSTGRES_PASSWORD: message_poc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U message_poc -d message_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  message-api:
    image: message-poc/message-api:local
    build:
      context: .
      args:
        SERVICE: message-api
    init: true
    ports:
      - "8080:8080"
    environment:
      <<: *application-environment
      DB_HOST: postgres
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: http://localhost:8083
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    logging: &application-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  validation-service:
    image: message-poc/validation-service:local
    build:
      context: .
      args:
        SERVICE: validation-service
    init: true
    environment:
      <<: *application-environment
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_API_URL: ${TYPESAFE_API_URL:-https://api.typesafe.ai/v1/systemone}
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    logging: *application-logging

  message-persistence:
    image: message-poc/message-persistence:local
    build:
      context: .
      args:
        SERVICE: message-persistence
    init: true
    ports:
      - "8083:8083"
    environment:
      <<: *application-environment
      DB_HOST: postgres
      LOKI_URL: http://loki:3100
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-christian.thurmann@gmail.com}
      MESSAGE_API_BASE_URL: http://localhost:8080
      MODERATION_WARNING_THRESHOLD: ${MODERATION_WARNING_THRESHOLD:-3}
      MODERATION_BAN_THRESHOLD: ${MODERATION_BAN_THRESHOLD:-6}
      MODERATION_BAN_LADDER: ${MODERATION_BAN_LADDER:-1m,5m,30m,2h,12h,24h}
      MODERATION_ESCALATION_WINDOW: ${MODERATION_ESCALATION_WINDOW:-1d}
      MODERATION_TECHNICAL_DLT_COUNTS_AS_STRIKE: ${MODERATION_TECHNICAL_DLT_COUNTS_AS_STRIKE:-false}
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    logging: *application-logging

  message-audit:
    image: message-poc/message-audit:local
    build:
      context: .
      args:
        SERVICE: message-audit
    init: true
    environment: *application-environment
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    logging: *application-logging

  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_USERS_VIEWERS_CAN_EDIT: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
  loki-data:
  alloy-data:
  grafana-data:
