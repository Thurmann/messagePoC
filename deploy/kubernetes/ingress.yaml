apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: message-poc
spec:
  tls:
    - hosts:
        - messages.example.com
        - api.messages.example.com
      secretName: message-poc-tls
  rules:
    - host: messages.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: message-persistence
                port:
                  number: 8083
    - host: api.messages.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: message-api
                port:
                  number: 8080
