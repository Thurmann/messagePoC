apiVersion: v1
kind: ConfigMap
metadata:
  name: message-poc-config
data:
  DEPLOYMENT_ENVIRONMENT: poc
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
  KAFKA_BOOTSTRAP_SERVERS: kafka-bootstrap.example.net:9092
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
  SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
  JDBC_URL: jdbc:postgresql://postgres.example.net:5432/message_poc
  DB_USER: message_poc
  LOKI_URL: https://loki.example.net
  TYPESAFE_API_URL: https://api.typesafe.ai/v1/systemone
  MODERATION_REJECT_THRESHOLD: "0.7"
  MODERATION_DLT_THRESHOLD: "0.95"
  # Public OAuth client ID (not a secret). Create it in Google Cloud Console; see README.
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com"
  ADMIN_EMAILS: christian.thurmann@gmail.com
  # Empty = the frontend calls the API on the same origin through the Ingress.
  MESSAGE_API_BASE_URL: ""
  # Empty = no cross-origin callers; the same-origin setup needs no CORS.
  CORS_ALLOWED_ORIGINS: ""
  MODERATION_WARNING_THRESHOLD: "3"
  MODERATION_BAN_THRESHOLD: "6"
  MODERATION_BAN_LADDER: "1m,5m,30m,2h,12h,24h"
  MODERATION_ESCALATION_WINDOW: "1d"
  MODERATION_TECHNICAL_DLT_COUNTS_AS_STRIKE: "true"
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
