apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-api
  template:
    metadata:
      labels:
        app: message-api
    spec:
      containers:
        - name: app
          image: message-poc/message-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: message-poc-config
          env:
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: message-poc-secrets
                  key: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
                  optional: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: message-api
spec:
  selector:
    app: message-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
