apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: message-poc
spec:
  # Three combined controller+broker nodes: a 3-voter KRaft quorum that tolerates
  # one node down. Each node gets its own persistent volume.
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    deleteClaim: false
  template:
    pod:
      affinity:
        # Prefer spreading brokers over different nodes (one per node when possible).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: message-poc
                    strimzi.io/pool-name: dual-role
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: message-poc
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # Must be a version supported by the installed Strimzi operator release.
    # compose.yaml uses Kafka 4.3.1; lower this if your operator does not support it.
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # RF 3 with min ISR 2: writes (acks=all) keep working with one broker down
      # and across rolling restarts. Do not set min ISR to 3.
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
