name: Release

# Push a tag such as v0.2.0 (or v0.2.0-rc.1 for a prerelease) to build, publish and release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# One release at a time, so the ordering check below sees every earlier release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release checks need main and the other release tags.
          fetch-depth: 0

      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag is on main and newer than the latest release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          # Compare the version without its prerelease suffix against the highest stable tag,
          # so v1.2.0-rc.1 is allowed before v1.2.0 but not after it.
          core="${VERSION%%-*}"
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$GITHUB_REF_NAME" \
            | sed 's/^v//' | sort -V | tail -n1)
          if [[ -n "$latest" ]]; then
            highest=$(printf '%s\n%s\n' "$latest" "$core" | sort -V | tail -n1)
            if [[ "$core" == "$latest" || "$highest" != "$core" ]]; then
              echo "::error::$GITHUB_REF_NAME is not newer than the latest release v$latest"
              exit 1
            fi
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build -PreleaseVersion="${{ steps.version.outputs.version }}" --no-daemon

      - name: Upload service jars
        uses: actions/upload-artifact@v7
        with:
          name: service-jars
          path: services/*/build/libs/*-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 7

  images:
    name: Publish image (${{ matrix.service }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [message-api, validation-service, message-persistence, message-audit]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/message-poc/${{ matrix.service }}
          # Tags without the v prefix match the newTag convention in the kustomizations.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
          flavor: |
            latest=${{ needs.verify.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            RELEASE_VERSION=${{ needs.verify.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    name: GitHub release
    needs: [verify, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: service-jars
          path: jars

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "## Container images"
            echo
            for svc in message-api validation-service message-persistence message-audit; do
              echo "- \`ghcr.io/${owner}/message-poc/${svc}:${VERSION}\`"
            done
          } > notes.md
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" jars/*/build/libs/*.jar

  deploy:
    name: Deploy
    needs: [verify, release]
    # Deploys stable releases when the repository variable DEPLOY_TO_AKS is true (see docs/ci-cd.md).
    if: needs.verify.outputs.prerelease == 'false' && vars.DEPLOY_TO_AKS == 'true'
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.verify.outputs.version }}
