name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump when run on main
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    # Skipped on a push to main when any pushed commit contains [skip bygg] or
    # [bygg skip] (case-insensitive), so several PRs can be merged in a row with
    # one build at the end. Pull requests and manual runs always build. The
    # tag and release jobs depend on these jobs, so they are skipped too.
    if: &build-wanted >-
      github.event_name != 'push' ||
      (!contains(join(github.event.commits.*.message, ' '), '[skip bygg]') &&
      !contains(join(github.event.commits.*.message, ' '), '[bygg skip]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Docker is available on the runner, so the Testcontainers integration tests run here too.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # The image jobs package these jars instead of compiling each service again inside Docker.
      # Not "service-jars": release.yml runs in the same workflow run on main and uploads that name.
      - name: Upload service jars
        uses: actions/upload-artifact@v7
        with:
          name: ci-service-jars
          path: |
            services/*/build/libs/*.jar
            !services/*/build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  images:
    name: Image (${{ matrix.service }})
    needs: build
    if: *build-wanted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [message-api, validation-service, message-persistence, message-audit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ci-service-jars
          path: ${{ runner.temp }}/jars

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            JAR_SOURCE=prebuilt
          build-contexts: jars=${{ runner.temp }}/jars
          platforms: linux/amd64
          push: false

  # Playwright runs the browser tests against the production build served with the real CSP; the backend is
  # mocked, so this needs no Docker. Not part of ./gradlew build (it downloads a browser); run it locally with
  # ./gradlew :frontend:e2eTest.
  e2e:
    name: Browser tests
    if: *build-wanted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run browser tests
        run: ./gradlew :frontend:e2eTest -PplaywrightWithDeps=true --no-daemon

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/build/playwright/
          retention-days: 7

  manifests:
    name: Render Kubernetes manifests
    if: *build-wanted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5

      - name: Render kustomizations
        run: |
          for dir in deploy/kubernetes deploy/kubernetes/kafka deploy/azure; do
            echo "::group::$dir"
            kubectl kustomize "$dir" > /dev/null
            echo "::endgroup::"
          done

  scripts:
    name: Azure scripts
    if: *build-wanted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5

      # The tests replace az, kubectl, helm and the other CLIs with stubs; nothing reaches Azure.
      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh

      - name: Test the Azure scripts
        run: bash scripts/tests/azure-scripts-test.sh

  # Tags each green push to main with the next version and releases it. The tag is pushed with
  # GITHUB_TOKEN, which does not trigger release.yml's tag trigger, so it is called directly below.
  tag:
    name: Tag release
    needs: [build, images, e2e, manifests, scripts]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push the next version tag
        id: tag
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          # A commit that already has a release tag was tagged by hand, which starts its own release.
          if [[ -n "$(git tag --points-at HEAD --list 'v*')" ]]; then
            echo "::notice::$(git rev-parse --short HEAD) already has a release tag; not tagging it again"
            exit 0
          fi
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1)
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
          case "$BUMP" in
            major) tag="v$((major + 1)).0.0" ;;
            minor) tag="v${major}.$((minor + 1)).0" ;;
            *)     tag="v${major}.${minor}.$((patch + 1))" ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
